name: Auto AI Comment Reply

on:
  schedule:
    - cron: '0 * * * *' # Har soatda ishlaydi
  workflow_dispatch: # Qo'lda ishga tushirish uchun

jobs:
  reply_to_comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv google-generativeai google-auth-oauthlib google-api-python-client

      - name: Create required files
        run: |
          echo '${{ secrets.AI_KEYS_JSON }}' > ai_keys_secret.json
        
      - name: Run Auto Reply Script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_reply.py
          
      - name: Commit replied_comments.json
        run: |
          git config --local user.email "bot@temurbek.dev"
          git config --local user.name "AutoReels Bot"
          git add replied_comments.json || true
          if [[ -n "$(git status --porcelain replied_comments.json)" ]]; then
            git commit -m "🤖 AutoReply: Update replied comments tracking [skip ci]"
            for i in {1..5}; do
              git pull origin main --rebase --autostash || (git rebase --abort && sleep 5 && continue)
              if git push; then
                break
              fi
              sleep 5
            done
          fi
