name: Merge Videos and Request Approval

on:
  repository_dispatch:
    types: [telegram_command]

jobs:
  merge-videos:
    if: github.event.client_payload.command == 'merge_videos'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Setup FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Merge Script 🎞
        env:
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          VIDEO_URLS: ${{ github.event.client_payload.prompt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python merge_runner.py

      - name: Upload High-Res Merged Video as Artifact 💾
        uses: actions/upload-artifact@v4
        with:
          name: merged_video_${{ github.run_id }}
          path: merged_high_res.mp4
          retention-days: 7
