name: Instagram Auto Reels Bot 🤖

on:
  workflow_dispatch:
    # Bu orqali GitHub pultidan qo'lda ham ishga tushirish mumkin
  repository_dispatch:
    types: [telegram_post, telegram_command, telegram_queue]

jobs:
  queue-video:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'telegram_queue'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4

      - name: Download video to queue 📥
        if: github.event.client_payload.video_url != ''
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FILE_NAME="${CUSTOM_NAME}_${{ github.run_id }}.mp4"
          else
            FILE_NAME="zz_tg_video_${{ github.run_id }}.mp4"
          fi
          curl -s -L -o "videos/pending/$FILE_NAME" "${{ github.event.client_payload.video_url }}"

      - name: Download video artifact 📦
        if: github.event.client_payload.artifact_run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.client_payload.artifact_run_id }}
          name: merged_video_${{ github.event.client_payload.artifact_run_id }}
          path: temp_artifact_dir
          
      - name: Move artifact to pending
        if: github.event.client_payload.artifact_run_id != ''
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FILE_NAME="${CUSTOM_NAME}_${{ github.run_id }}.mp4"
          else
            FILE_NAME="zz_tg_video_${{ github.run_id }}.mp4"
          fi
          mv temp_artifact_dir/merged_high_res.mp4 "videos/pending/$FILE_NAME"
          
      - name: Save Manual Caption 📝
        if: github.event.client_payload.caption != ''
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FILE_NAME="${CUSTOM_NAME}_${{ github.run_id }}.txt"
          else
            FILE_NAME="zz_tg_video_${{ github.run_id }}.txt"
          fi
          cat << 'EOF' > "videos/pending/$FILE_NAME"
          ${{ github.event.client_payload.caption }}
          EOF

      - name: Save Platform Choice 💾
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            BASE_NAME="${CUSTOM_NAME}_${{ github.run_id }}"
          else
            BASE_NAME="zz_tg_video_${{ github.run_id }}"
          fi
          PLATFORM="${{ github.event.client_payload.platform }}"
          if [ -n "$PLATFORM" ]; then
            echo "$PLATFORM" > "videos/pending/$BASE_NAME.platform.txt"
          fi

      - name: Save Trial Choice 🧪
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            BASE_NAME="${CUSTOM_NAME}_${{ github.run_id }}"
          else
            BASE_NAME="zz_tg_video_${{ github.run_id }}"
          fi
          IS_TRIAL="${{ github.event.client_payload.is_trial }}"
          if [ "$IS_TRIAL" = "true" ]; then
            echo "true" > "videos/pending/$BASE_NAME.trial.txt"
          fi

      - name: Commit and Push changes 💾
        run: |
          git config --local user.email "bot@temurbek.dev"
          git config --local user.name "AutoReels Bot"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A videos/
            git commit -m "🤖 Bot: Video navbatga (pending) saqlandi"
            for i in {1..5}; do
              git pull origin main --rebase --autostash || (git rebase --abort && sleep 5 && continue)
              if git push; then
                break
              fi
              sleep 5
            done
          fi

  post-video:
    if: github.event_name != 'repository_dispatch' || github.event.action == 'telegram_post'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repozitoriyaga o'zgarishlarni yozish (commit qilish) huquqi
      actions: read

    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4

      - name: Download video from Telegram (if webhook) 📥
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.video_url != ''
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FILE_NAME="${CUSTOM_NAME}_${{ github.run_id }}.mp4"
          else
            FILE_NAME="zz_tg_video_${{ github.run_id }}.mp4"
          fi
          curl -s -L -o "videos/pending/$FILE_NAME" "${{ github.event.client_payload.video_url }}"
          echo "TARGET_VIDEO=$FILE_NAME" >> $GITHUB_ENV

      - name: Download video artifact 📦
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.artifact_run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.client_payload.artifact_run_id }}
          name: merged_video_${{ github.event.client_payload.artifact_run_id }}
          path: temp_artifact_dir
          
      - name: Move artifact to pending
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.artifact_run_id != ''
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FILE_NAME="${CUSTOM_NAME}_${{ github.run_id }}.mp4"
          else
            FILE_NAME="zz_tg_video_${{ github.run_id }}.mp4"
          fi
          mv temp_artifact_dir/merged_high_res.mp4 "videos/pending/$FILE_NAME"
          echo "TARGET_VIDEO=$FILE_NAME" >> $GITHUB_ENV

      - name: Save Manual Caption 📝
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.caption != ''
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FILE_NAME="${CUSTOM_NAME}_${{ github.run_id }}.txt"
          else
            FILE_NAME="zz_tg_video_${{ github.run_id }}.txt"
          fi
          cat << 'EOF' > "videos/pending/$FILE_NAME"
          ${{ github.event.client_payload.caption }}
          EOF

      - name: Save Platform Choice 💾
        if: github.event_name == 'repository_dispatch'
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            BASE_NAME="${CUSTOM_NAME}_${{ github.run_id }}"
          else
            BASE_NAME="zz_tg_video_${{ github.run_id }}"
          fi
          PLATFORM="${{ github.event.client_payload.platform }}"
          if [ -n "$PLATFORM" ]; then
            echo "$PLATFORM" > "videos/pending/$BASE_NAME.platform.txt"
          fi

      - name: Save Trial Choice 🧪
        if: github.event_name == 'repository_dispatch'
        run: |
          CUSTOM_NAME="${{ github.event.client_payload.custom_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            BASE_NAME="${CUSTOM_NAME}_${{ github.run_id }}"
          else
            BASE_NAME="zz_tg_video_${{ github.run_id }}"
          fi
          IS_TRIAL="${{ github.event.client_payload.is_trial }}"
          if [ "$IS_TRIAL" = "true" ]; then
            echo "true" > "videos/pending/$BASE_NAME.trial.txt"
          fi

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyngrok python-dotenv

      - name: Run Cloud Bot 🚀
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_KEYS_JSON: ${{ secrets.AI_KEYS_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python github_runner.py

      - name: Commit and Push changes 💾
        run: |
          git config --local user.email "bot@temurbek.dev"
          git config --local user.name "AutoReels Bot"
          # Check if there are any changes (like video moved to posted folder)
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A videos/
            git commit -m "🤖 Bot: Bitta video Instagramga joylandi va papkasi o'zgartirildi"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "Hech qanday o'zgarish yo'q (Video joylanmadi yoki qolmadi)."
          fi

  handle-command:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'telegram_command'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
          
      - name: Run Telegram Command 🤖
        env:
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AI_KEYS_JSON: ${{ secrets.AI_KEYS_JSON }}
          TELEGRAM_COMMAND: ${{ github.event.client_payload.command }}
          TELEGRAM_PROMPT: ${{ github.event.client_payload.prompt }}
          TELEGRAM_INTERVAL: ${{ github.event.client_payload.interval }}
          TELEGRAM_LAST_RUN: ${{ github.event.client_payload.last_run }}
        run: |
          python bot_controller.py
          
      - name: Commit and Push changes (if any files deleted/modified) 💾
        run: |
          git config --local user.email "bot@temurbek.dev"
          git config --local user.name "AutoReels Bot"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A videos/
            git commit -m "🤖 Bot: Telegram komandasi orqali fayllar o'zgartirildi"
            for i in {1..5}; do
              git pull origin main --rebase --autostash || (git rebase --abort && sleep 5 && continue)
              if git push; then
                break
              fi
              sleep 5
            done
          fi
