<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Yuklash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-theme-bg-color: #1a1a1a;
            --tg-theme-text-color: #ffffff;
            --tg-theme-button-color: #2b5876;
            --tg-theme-button-text-color: #ffffff;
            --primary-gradient: linear-gradient(135deg, #4e54c8, #8f94fb);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(#fff, #a0a5aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(0,0,0,0.2);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #8f94fb;
            background: rgba(143, 148, 251, 0.1);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .file-name {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            color: #8f94fb;
            word-break: break-all;
        }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn.active:active {
            transform: scale(0.98);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 13px;
            color: #a0a5aa;
            margin-top: 10px;
            display: none;
        }
        
        /* Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cloud Upload 🚀</h1>
        <p>Telegramning 20MB limitidan qochish uchun videoni to'g'ridan-to'g'ri serverga yuklang.</p>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📤</div>
            <div style="font-weight: 500;">Videoni tanlang</div>
            <div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 5px;">(Faqat MP4 yoki MOV fayllar)</div>
            <input type="file" id="fileInput" accept="video/mp4,video/quicktime">
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">0% Yuklandi...</div>

        <button class="btn" id="uploadBtn" onclick="uploadVideo()">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">Serverga Yuklash</span>
        </button>
    </div>

    <script>
        // Init Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Full screen
        
        // Pass Telegram user context if possible
        const initData = tg.initData || '';

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');

        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                let sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(1);
                fileNameDisplay.textContent = `${selectedFile.name} (${sizeMB} MB)`;
                uploadBtn.classList.add('active');
            }
        });

        // Drag and drop support
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                let event = new Event('change');
                fileInput.dispatchEvent(event);
            }
        });

        function uploadVideo() {
            if (!selectedFile) return;

            // UI ni bloklash
            uploadBtn.classList.remove('active');
            uploadArea.style.pointerEvents = 'none';
            btnSpinner.style.display = 'inline-block';
            btnText.textContent = "Yuklanmoqda...";
            
            progressContainer.style.display = 'block';
            statusText.style.display = 'block';

            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('tg_data', initData);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'upload.php', true);

            // Progress bar handler
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    let percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percentComplete + '%';
                    statusText.textContent = percentComplete + '% Yuklandi...';
                    
                    if (percentComplete === 100) {
                        statusText.textContent = 'Serverda qayta ishlanmoqda, kuting...';
                    }
                }
            };

            xhr.onload = function() {
                btnSpinner.style.display = 'none';
                if (xhr.status === 200) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            btnText.textContent = "✅ Muvaffaqiyatli!";
                            statusText.textContent = 'Telegram botingizga xabar yuborildi!';
                            progressBar.style.background = '#00C853';
                            
                            // 2 sekunddan keyin WebAppni yopish
                            setTimeout(() => {
                                tg.close();
                            }, 2000);
                        } else {
                            showError(response.error || "Noma'lum xato");
                        }
                    } catch (e) {
                        showError("Server noto'g'ri javob qaytardi");
                    }
                } else {
                    showError("Server xatosi: " + xhr.status);
                }
            };

            xhr.onerror = function() {
                showError("Internet tarmog'ida xatolik yuz berdi");
            };

            xhr.send(formData);
        }

        function showError(msg) {
            btnSpinner.style.display = 'none';
            btnText.textContent = "Xatolik!";
            statusText.textContent = "❌ " + msg;
            statusText.style.color = "#ff5252";
            progressBar.style.background = "#ff5252";
            uploadBtn.classList.add('active');
            uploadArea.style.pointerEvents = 'auto';
        }
    </script>
</body>
</html>
